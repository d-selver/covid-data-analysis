[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-surveillance-analysis"
version = "1.0.0"
description = "Python analysis of public COVID-19 surveillance data"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
covid-analysis = "covid_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
